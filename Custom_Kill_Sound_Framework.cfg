# Custom Kill Sound Framework - 配置文件 / Configuration
# 每次加载对局时读取一次；对局中修改需重新加载或切换对局才生效
# Read once per battle load; mid-match edits apply after reloading / switching battle
# 音效文件命名与安装说明见发布页 / File naming and setup instructions are on the mod page
# ==============================================================

[0.Master]

## 总开关：关闭后本插件不播放任何音效 / Master switch: OFF mutes every sound
## 启动时找不到音效文件会自动设为 false，检查文件后请手动改回 true
## Auto-set to false when no sound file is found; set it back to true yourself after fixing the files
## 默认 / Default: true
MasterEnable = true

[1.Switches]

## 爆头音效开关 / Headshot sound (a head hit that kills)
## 默认 / Default: true
EnableHeadshot = true

## 命中音效开关 / Hit sound (wounding an enemy without a kill)
## 默认 / Default: true
EnableHit = true

## 击杀音效开关 / Kill sound (killing an enemy soldier)
## 默认 / Default: true
EnableKill = true

[2.Volume]

## 爆头音效音量，0.00 - 1.00 / Headshot volume, 0.00 - 1.00
## 默认 / Default: 1.00
HeadshotVolume = 1.00

## 命中音效音量，0.00 - 1.00 / Hit volume, 0.00 - 1.00
## 默认 / Default: 1.00
HitVolume = 1.00

## 击杀音效音量，0.00 - 1.00 / Kill volume, 0.00 - 1.00
## 默认 / Default: 1.00
KillVolume = 1.00

[3.Debug]

## 调试日志开关：开启后把判定过程写入 BepInEx\LogOutput.log / Debug log: writes decisions to BepInEx\LogOutput.log
## 默认 / Default: false
EnableDebugLog = false
